services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: badger-staffpanel
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: BadgerStaffPanel+
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8080}
      APP_KEY: "${APP_KEY:-base64:uUKC+FsxQoVrhFw3a1BgJaq9qaMPdcqp+/Lq3/VDEHw=}"
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: staffpanel_db
      DB_USERNAME: staffpanel
      DB_PASSWORD: secret
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      USE_CAPTCHA: "false"
      PUBLIC_BANS: "true"
      MASTER_API_KEY: "${MASTER_API_KEY:-a700bdc6ac5405a3bd39726f7aff2db31b013818bc47ef1feebbef9e047402f0}"
      MASTER_ADMIN_DISCORD_ID: "${MASTER_ADMIN_DISCORD_ID:-}"
      MASTER_ADMIN_ROLE_ID: "${MASTER_ADMIN_ROLE_ID:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI:-}"
      DISCORD_REDIRECT_AUTH: "${DISCORD_REDIRECT_AUTH:-}"
      GOOGLE_CAPTCHA_KEY: "${GOOGLE_CAPTCHA_KEY:-}"
      GOOGLE_CAPTCHA_SECRET: "${GOOGLE_CAPTCHA_SECRET:-}"
    volumes:
      - .:/var/www/html
      - staffpanel_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: badger-staffpanel-mysql
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    environment:
      MYSQL_DATABASE: staffpanel_db
      MYSQL_USER: staffpanel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - staffpanel_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  staffpanel_mysql:
  staffpanel_vendor:
